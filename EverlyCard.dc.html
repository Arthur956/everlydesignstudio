<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="Everly Product.dc.html" style="display:flex;flex-direction:column;gap:10px;color:#2A1C14;text-decoration:none">
<div style="position:relative;aspect-ratio:4/5;border-radius:{{ outerRadius }};background:{{ bg }};display:flex;align-items:center;justify-content:center">
<div style="width:68%;aspect-ratio:1;border-radius:{{ innerRadius }};background:{{ shirt }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:{{ gap }};box-shadow:0 8px 20px -10px rgba(42,28,20,.3)">
<div style="display:flex;gap:4px;align-items:flex-end"><sc-for list="{{ people }}" as="q" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;align-items:center"><div style="width:{{ headSize }};height:{{ headSize }};border-radius:50%;background:{{ q.head }}"></div><div style="width:{{ bodyW }};height:{{ bodyH }};border-radius:18px 18px 3px 3px;background:{{ top }};margin-top:-2px"></div></div></sc-for></div>
<span style="font-family:'Bricolage Grotesque';font-size:{{ nameSize }};font-weight:600;color:{{ ink }};text-align:center;padding:0 6px">{{ names }}</span>
</div>
<sc-if value="{{ badge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:10px;left:10px;background:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px">{{ badge }}</span></sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:3px">
<span style="font-size:{{ titleSize }};font-weight:600;line-height:1.3">{{ title }}</span>
<span style="font-size:13px;color:#6B5648"><span style="color:#E25F0C">★</span> {{ rating }} · {{ variant }}</span>
<span style="font-size:{{ titleSize }};font-weight:700;margin-top:2px">{{ price }}</span>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:480},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;s&quot;,&quot;l&quot;],&quot;default&quot;:&quot;l&quot;,&quot;tsType&quot;:&quot;'s'|'l'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.product || {};
    const lg = (this.props.size ?? 's') === 'l';
    const S = ['#F2CDB0', '#D9A27E', '#8C5A3C', '#F6D9C4'];
    const H = { blond: '#E3B65B', bruin: '#6B4226', zwart: '#2A1C14', rood: '#B5532A', grijs: '#B9B3AC' };
    const people = (p.people || 'bruin:0,blond:1').split(',').map(x => { const [h, s] = x.split(':'); return { head: `linear-gradient(${H[h]} 0 40%, ${S[+s]} 40%)` }; });
    return {
      people, top: p.top || '#E25F0C', bg: p.bg || '#F4EBE0', shirt: p.shirt || '#FFFFFF', ink: p.ink || '#2A1C14',
      names: p.names || '', badge: p.badge || null, title: p.title || '', rating: p.rating || '4,9', variant: p.variant || '', price: p.price || '',
      outerRadius: lg ? '20px' : '16px', innerRadius: p.round ? '50%' : (lg ? '18px' : '14px'),
      headSize: lg ? '26px' : '17px', bodyW: lg ? '34px' : '22px', bodyH: lg ? '13px' : '9px',
      nameSize: lg ? '13px' : '10px', gap: lg ? '10px' : '6px', titleSize: lg ? '17px' : '15px'
    };
  }
}
</script>
</body>
</html>
